apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../single-node

patches:
  - patch: |
      - op: add
        path: /spec/virtualCluster/gardener/gardenerAPIServer/deployment
        value:
          enableHealthProbes: false
          replicaCount: 1
      - op: add
        path: /spec/virtualCluster/gardener/gardenerControllerManager
        value:
          deployment:
            enableHealthProbes: false
            enableLeaderElection: false
            replicaCount: 1
      - op: add
        path: /spec/virtualCluster/gardener/gardenerScheduler
        value:
          deployment:
            enableHealthProbes: false
            enableLeaderElection: false
            replicaCount: 1
      - op: add
        path: /spec/virtualCluster/gardener/gardenerAdmissionController
        value:
          deployment:
            enableHealthProbes: false
            replicaCount: 1
    target:
      group: operator.gardener.cloud
      kind: Garden
      name: local
